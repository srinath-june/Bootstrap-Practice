<!doctype html>
<html lang="en">
  <head>
    <title>Document</title>
    <link rel="stylesheet" href="./../BOOTSTRAP/bootstrap/css/bootstrap.css">
    <link
      rel="stylesheet"
      href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.13.1/font/bootstrap-icons.min.css"
    />
    <style>
      img {
        height: 200px !important;
        width: 100% !important;
      }
    </style>
  </head>
  <body>
    <nav class="navbar bg-dark navbar-dark">
      <div class="container-fluid">
        <a class="navbar-brand" href="#">⌚Timer Counter</a>
      </div>
    </nav>

    <section class="container-fluid mt-4">
      <div class="row">
        <div class="col-4 m-auto">
          <div class="card">
            <div class="card-body text-center">
                <h1>
                    <span id="min-ele">00</span>
                    <span id="sec-ele">00</span>
                    <span id="m-sec-ele">00</span>
                </h1>
                <div>
                    <button class="btn btn-success" id="start-btn">Start</button>
                    <button class="btn btn-danger" id="stop-btn">Stop</button>
                    <button class="btn btn-warning" id="reset-btn">Reset</button>
                </div>
            </div>
          </div>
        </div>
      </div>
    </section>

    <footer style="margin-bottom: 400px"></footer>

    <!-- Script Code -->
    <script src="./stopWatch.js">
      
    </script>
  </body>
</html>
