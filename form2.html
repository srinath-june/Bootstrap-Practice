<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <link rel="stylesheet" href="./../bootstrap/css/bootstrap.css">
</head>
<body>
         <nav class="navbar bg-dark navbar-dark">
        <div class="continar-fluid">
            <a class="navbar-brand "> JS count</a>
            </div>
            </nav>
            <section class="continar-fluid mt-5">
                <div class="row">
                    <div class="col-4 m-auto">
                        <div class="card">
                            <div class="card-header bg-dark text-white text-center">
                                <h2> Username Box</h2>
                            </div>
                            <div class="card-body text-center">
                                <form>
                                <div class="mb-2">
                                <input type="text" placeholder="Enter username" class="form-control" id="usn-box"/>
                                </form>
                                </div>
                                <div class="card-footer bg-dark text-center text-white">
                                    <h2 id="enter-name"> Username</h2>
                                </div>
                            </div>
                        </div>
                    </div>
                </div>
            </section>
            <footer style="margin: bottom 400px;"></footer>
</body>
<!--Script code-->
<script>
    let usnEle=document.getElementById('usn-box');
    let enterEle=document.getElementById('enter-name');
    
    usnEle.addEventListener('keyup',function()
    {
        let enteredName=usnEle.value;
        enterEle.textContent=enteredName;
    });
</script>
</html>
